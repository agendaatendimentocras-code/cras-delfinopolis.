    <script>
      /* Calendário próprio do CRAS — aprimora os campos de data já existentes. */
      (function () {
        if (window.__crasDatePicker) return;
        window.__crasDatePicker = true;
        var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        var DIAS = ['D','S','T','Q','Q','S','S'];
        var ICONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
        var wrapAtual = null, pop = null, refAno = 0, refMes = 0;

        function dois(n) { return String(n).padStart(2, '0'); }
        function iso(d) { return d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate()); }
        function parseIso(v) {
          var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
          if (!m) return null;
          var d = new Date(+m[1], +m[2] - 1, +m[3]);
          return isNaN(d.getTime()) ? null : d;
        }
        function hojeIso() { return iso(new Date()); }
        /* ---- vagas por dia (opcional, so depois de informado) ---- */
        var vagasCfg = null, vagasFila = null;
        function carregarVagas() {
          if (vagasCfg !== null) return;
          if (vagasFila) return;
          vagasCfg = false;
          try {
            var url = '', key = '';
            var sc = document.querySelector('script[src*="/assets/index.js"]');
            var m = /^https?:/.test(location.protocol) ? null : null;
            url = (window.__CRAS_SB_URL || '') ; key = (window.__CRAS_SB_KEY || '');
            if (!url || !key) {
              try {
                var keys = Object.keys(window.localStorage || {});
                for (var i = 0; i < keys.length; i++) {
                  if (!/supabase\.co/.test(keys[i])) continue;
                  var raw = window.localStorage.getItem(keys[i]);
                  var o = JSON.parse(raw);
                  if (o && o.supabaseUrl && o.supabaseKey) { url = o.supabaseUrl; key = o.supabaseKey; break; }
                }
              } catch (e) {}
            }
            if (!url || !key) { vagasCfg = {}; return; }
            vagasFila = fetch(url.replace(/\/$/, '') + '/rest/v1/configuracoes?select=chave,valor&chave=in.(vagas_padrao,vagas_distrito,dias_distrito,vagas_dia_0,vagas_dia_1,vagas_dia_2,vagas_dia_3,vagas_dia_4,vagas_dia_5,vagas_dia_6)', { headers: { apikey: key, Authorization: 'Bearer ' + key } })
              .then(function (r) { return r.json(); })
              .then(function (rows) {
                var cfg = {};
                (rows || []).forEach(function (r) { cfg[r.chave] = r.valor; });
                vagasCfg = cfg;
                if (pop && wrapAtual && wrapAtual.querySelector('input[data-cras-vagas="1"]')) {
                  var inp = wrapAtual.querySelector('input[type="date"]');
                  marcarVagas(inp);
                }
              })
              .catch(function () { vagasCfg = {}; });
          } catch (e) { vagasCfg = {}; }
        }
        function totalVagas(dia) {
          var cfg = vagasCfg || {};
          var d = parseIso(dia);
          if (!d) return 0;
          var wd = d.getDay();
          var porDia = cfg['vagas_dia_' + wd];
          if (porDia !== undefined && porDia !== '') return parseInt(porDia, 10) || 0;
          var padrao = parseInt(cfg.vagas_padrao || '', 10) || 20;
          var distrito = (cfg.dias_distrito || '').split(',').map(function (x) { return x.trim(); });
          if (distrito.indexOf(String(wd)) !== -1) return parseInt(cfg.vagas_distrito || '', 10) || 15;
          return padrao;
        }
        function marcarVagas(inp) {
          if (!pop || !inp || inp.getAttribute('data-cras-vagas') !== '1') return;
          var ocupados = window.__CRAS_OCUPADO_dados || null;
          if (!ocupados || !vagasCfg) return;
          var dias = pop.querySelectorAll('.cras-dp-day[data-dia]');
          for (var i = 0; i < dias.length; i++) {
            var el = dias[i], k = el.getAttribute('data-dia');
            var restam = totalVagas(k) - (ocupados[k] || 0);
            el.classList.remove('has-vagas'); el.classList.remove('is-vagas-off');
            if (restam > 0) el.classList.add('has-vagas');
            else el.classList.add('is-vagas-off');
          }
        }
        function limite(inp, attr) {
          var v = inp.getAttribute(attr);
          return parseIso(v) ? v : null;
        }
        function aplicarData(inp, valor) {
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(inp, valor);
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
          try { inp.dispatchEvent(new Event('blur', { bubbles: true })); } catch (e) {}
        }

        /* 1) coloca um botão de calendário ao lado de cada campo de data */
        function melhorar(inp) {
          if (!inp || inp.dataset.crasDp === '1') return;
          if (inp.closest('.cras-dp-wrap') || inp.closest('.cras-dp-pop')) return;
          if (inp.type !== 'date') return;
          inp.dataset.crasDp = '1';
          var wrap = document.createElement('div');
          wrap.className = 'cras-dp-wrap';
          inp.parentNode.insertBefore(wrap, inp);
          wrap.appendChild(inp);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cras-dp-btn';
          btn.setAttribute('aria-label', 'Abrir calendário');
          btn.innerHTML = ICONE;
          btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            toggle(inp, wrap);
          });
          wrap.appendChild(btn);
        }
        function varrer(raiz) {
          var lista = (raiz || document).querySelectorAll('input[type="date"]');
          for (var i = 0; i < lista.length; i++) melhorar(lista[i]);
        }

        /* 2) painel do calendário */
        function fechar() {
          if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
          pop = null;
          if (wrapAtual) wrapAtual.classList.remove('is-open');
          wrapAtual = null;
        }
        function toggle(inp, wrap) {
          if (wrapAtual === wrap) { fechar(); return; }
          fechar();
          wrapAtual = wrap;
          wrap.classList.add('is-open');
          var sel = parseIso(inp.value) || parseIso(hojeIso()) || new Date();
          refAno = sel.getFullYear();
          refMes = sel.getMonth();
          montar(inp, wrap);
        }
        function posicionar(wrap) {
          if (!pop) return;
          var r = wrap.getBoundingClientRect();
          var pw = pop.offsetWidth, ph = pop.offsetHeight;
          var vw = window.innerWidth, vh = window.innerHeight;
          var top = r.bottom + 6;
          if (top + ph > vh - 8) {
            var acima = r.top - ph - 6;
            top = acima >= 8 ? acima : Math.max(8, vh - ph - 8);
          }
          var left = r.left;
          if (left + pw > vw - 8) left = vw - pw - 8;
          if (left < 8) left = 8;
          pop.style.top = Math.round(top) + 'px';
          pop.style.left = Math.round(left) + 'px';
        }
        function montar(inp, wrap) {
          if (!pop) {
            pop = document.createElement('div');
            pop.className = 'cras-dp-pop';
            pop.setAttribute('role', 'dialog');
            pop.setAttribute('aria-label', 'Escolher data');
            document.body.appendChild(pop);
          }
          var min = limite(inp, 'min'), max = limite(inp, 'max');
          var valor = parseIso(inp.value);
          var selIso = valor ? iso(valor) : '';
          var html = '';
          html += '<div class="cras-dp-head" style="display:flex;flex-wrap:nowrap;align-items:center;gap:5px;width:100%">';
          html += '<button type="button" class="cras-dp-nav" data-nav="-1" aria-label="Mês anterior" style="flex:0 0 26px;width:26px;height:32px;padding:0;font-size:16px;line-height:1">‹</button>';
          html += '<select class="cras-dp-sel" data-tipo="mes" aria-label="Mês" style="flex:1 1 0;width:0;height:32px;padding:0 2px;font-size:13px">';
          for (var m = 0; m < 12; m++) html += '<option value="' + m + '"' + (m === refMes ? ' selected' : '') + '>' + MESES[m] + '</option>';
          html += '</select>';
          html += '<select class="cras-dp-sel" data-tipo="ano" aria-label="Ano" style="flex:0 0 78px;width:78px;height:32px;padding:0 2px;font-size:13px">';
          var a0 = refAno - 60, a1 = refAno + 20;
          if (min) a0 = Math.min(a0, +min.slice(0, 4));
          if (max) a1 = Math.max(a1, +max.slice(0, 4));
          for (var a = a0; a <= a1; a++) html += '<option value="' + a + '"' + (a === refAno ? ' selected' : '') + '>' + a + '</option>';
          html += '</select>';
          html += '<button type="button" class="cras-dp-nav" data-nav="1" aria-label="Próximo mês" style="flex:0 0 26px;width:26px;height:32px;padding:0;font-size:16px;line-height:1">›</button>';
          html += '</div>';
          html += '<div class="cras-dp-grid">';
          for (var w = 0; w < 7; w++) html += '<div class="cras-dp-wd" style="padding:2px 0 4px;margin:0;text-align:center;font-size:10px;font-weight:700;color:#9ca3af">' + DIAS[w] + '</div>';
          var primeiro = new Date(refAno, refMes, 1);
          var inicio = (primeiro.getDay() + 6) % 7; /* começa na segunda */
          var base = new Date(refAno, refMes, 1 - inicio);
          var hj = hojeIso();
          for (var i = 0; i < 42; i++) {
            var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
            var k = iso(d);
            var fora = d.getMonth() !== refMes;
            var cls = 'cras-dp-day';
            if (fora) cls += ' is-out';
            if (k === hj) cls += ' is-today';
            if (k === selIso) cls += ' is-sel';
            html += '<button type="button" class="' + cls + '" data-dia="' + k + '"' + (fora ? ' tabindex="-1"' : '') + '>' + d.getDate() + '</button>';
          }
          html += '</div>';
          html += '<div class="cras-dp-foot">';
          html += '<button type="button" class="cras-dp-hoje" data-hoje="1">Hoje</button>';
          if (inp.getAttribute('data-cras-vagas') === '1') html += '<span class="cras-dp-legenda"><i></i> dia com vaga</span>';
          html += '<span class="cras-dp-limite">' + (min && max ? 'De ' + min.split('-').reverse().join('/') + ' a ' + max.split('-').reverse().join('/') : min ? 'A partir de ' + min.split('-').reverse().join('/') : max ? 'Até ' + max.split('-').reverse().join('/') : '') + '</span>';
          html += '</div>';
          pop.innerHTML = html;
          posicionar(wrap);
          if (inp.getAttribute('data-cras-vagas') === '1') {
            if (!vagasCfg) carregarVagas();
            marcarVagas(inp);
          }
        }
        function escolher(inp, k) {
          var min = limite(inp, 'min'), max = limite(inp, 'max');
          if (min && k < min) k = min;
          if (max && k > max) k = max;

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.children && el.children.length > 0) continue;
      var t = (el.textContent || '').trim();
      if (t.indexOf('[ENCAIXE]') !== 0) continue;
      if (el.parentNode && el.parentNode.querySelector && el.parentNode.querySelector('.crx-encaixe-tag')) continue;
      var clean = t.replace(/^\[ENCAIXE\]\s*[\-–:]?\s*/i, '').trim();
      el.textContent = clean || 'Encaixe';
      el.style.color = '#166534';
      el.style.fontWeight = '600';

      if (el.parentNode) el.parentNode.insertBefore(tag, el.nextSibling);

  function refreshCounter() {

  /* ---------------- acesso aos dados --------------
     Fala direto com o banco usando a sessão que já está aberta no navegador.
     Não depende de nenhum arquivo do sistema que possa estar velho no cache. */
  var SB_URL = 'https://tizruuquhhpmykkjsmpn.supabase.co';
  var SB_KEY = 'sb_publishable_l-COxHSUAoiOf7PMXAb3SQ_ZWZk1v1w';

  function accessToken() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || !/-auth-token$/.test(k)) continue;
        var raw = null;
        try { raw = localStorage.getItem(k); } catch (e) { raw = null; }
        if (!raw) continue;
        var o = null;
        try { o = JSON.parse(raw); } catch (e) { o = null; }
        if (o && o.access_token) return o.access_token;
        if (o && o.currentSession && o.currentSession.access_token) return o.currentSession.access_token;
      }
    } catch (e) {}
    return '';
  }

  function totalFrom(cr) {
    if (!cr) return null;
    var parts = String(cr).split('/');
    var n = Number(parts[1]);
    return isNaN(n) ? null : n;
  }

  function api(path, opt) {
    opt = opt || {};
    var h = { apikey: SB_KEY };
    var tk = accessToken();
    if (tk) h.Authorization = 'Bearer ' + tk;
    if (opt.prefer) h.Prefer = opt.prefer;
    if (opt.range) h.Range = opt.range;
    if (opt.body !== undefined) h['Content-Type'] = 'application/json';
    return fetch(SB_URL + path, {
      method: opt.method || 'GET',
      headers: h,
      body: opt.body === undefined ? undefined : JSON.stringify(opt.body),
      cache: 'no-store',
      credentials: 'omit'
    }).then(function (r) {
      return r.text().then(function (txt) {
        var data = null;
        if (txt) { try { data = JSON.parse(txt); } catch (e) { data = txt; } }
        if (!r.ok) {
          var msg = (data && (data.message || data.error_description || data.hint || data.msg)) || ('Falha de comunicação (' + r.status + ')');
          var err = new Error(msg);
          err.code = (data && data.code) || ('HTTP' + r.status);
          err.status = r.status;
          throw err;
        }
        return { data: data, total: totalFrom(r.headers.get('content-range')) };
      });
    });
  }
  function enc(v) { return encodeURIComponent(v); }

  function selectRows(path) {
    return api(path).then(function (r) { return (r.data || []); });

  function getLimit() {

  function countEncaixes(date) {
    var path = '/rest/v1/atendimentos?select=id&data=eq.' + enc(date)
      + '&status=neq.cancelado'
      + '&observacoes=ilike.' + enc('*[ENCAIXE]*');
    return api(path, { prefer: 'count=exact' })
      .then(function (r) {
        if (r.total !== null && r.total !== undefined) return r.total;
        return (r.data && r.data.length) || 0;
      });
  }

  function getClosedReason(date) {
    return Promise.all([
      api('/rest/v1/feriados?select=data,nome&data=eq.' + enc(date) + '&fechado=eq.true&limit=1')
        .then(function (r) { return (r.data && r.data[0]) || null; })
        .catch(function () { return null; }),
      api('/rest/v1/configuracoes?select=valor&chave=eq.agenda_dia_vagas&limit=1')
        .then(function (r) { return (r.data && r.data[0]) || null; })
        .catch(function () { return null; })
    ]).then(function (r) {
      if (r[0] && r[0].data) return 'Esta data está marcada como feriado/dia fechado.';
      var map = {};
      try { map = JSON.parse((r[1] && r[1].valor) || '{}') || {}; } catch (e) { map = {}; }
      if (Object.prototype.hasOwnProperty.call(map, date) && Number(map[date]) === 0) return 'Esta data está fechada na Agenda.';
      return '';
    });
  }

  function makeModal() {

    document.body.appendChild(modal);

  function searchUsers() {

      .then(function (r) {

        var save = modal.querySelector('#crx-save');

          save.disabled = true;
        } else if (currentCount >= currentLimit) {
          say('Limite do dia atingido: ' + currentCount + '/' + currentLimit + '. Cancelar um Encaixe libera a vaga.', 'warn');

        } else {
          say('Disponível: ' + currentCount + ' de ' + currentLimit + ' Encaixes usados neste dia.', 'ok');

  function saveEncaixe() {

    var date = modal.querySelector('#crx-date').value;

      say('Preencha a data, selecione o cidadão e escolha o tipo de atendimento.', 'error');
      return;
    }
    var btn = modal.querySelector('#crx-save');
    btn.disabled = true; btn.textContent = 'Salvando...';
    var cidadao = selectedUser;
    function gravar() {
      return api('/rest/v1/rpc/cras_registrar_encaixe', {
        method: 'POST',
        prefer: 'return=minimal',
        body: { p_data: date, p_horario: time, p_tipo_id: typeId, p_profissional_id: profId, p_usuario_id: cidadao.id, p_observacoes: notes }
      });
    }
    function gravarDireto() {
      return api('/rest/v1/atendimentos', {
        method: 'POST',
        prefer: 'return=minimal',
        body: {
          data: date, horario: time, tipo_id: typeId, profissional_id: profId,
          usuario_id: cidadao.id,
          observacoes: MARK + (notes ? ' ' + notes : ''),
          status: 'agendado'
        }
      });
    }
    checkDay()
      .then(function () {
        if (closedReason) throw new Error(closedReason);
        if (currentCount >= currentLimit) throw new Error('Limite diário de Encaixes atingido (' + currentCount + '/' + currentLimit + ').');
        return gravar().catch(function (e) {
          var semFuncao = e && (e.code === 'PGRST202' || e.status === 404 || /could not find the function|function.*not found|schema cache/i.test(e.message || ''));
          if (!semFuncao) throw e;
          /* Plano B (função do banco ainda não instalada): confere de novo e grava direto. */
          return Promise.all([getClosedReason(date), countEncaixes(date), getLimit()]).then(function (r) {
            if (r[0]) throw new Error(r[0]);
            if (r[1] >= r[2]) throw new Error('Limite diário de Encaixes atingido (' + r[1] + '/' + r[2] + ').');
            return gravarDireto();
          });
        });
      })
      .then(function () {
        say('Encaixe registrado com sucesso. Atualizando a tela...', 'ok');
        btn.textContent = 'Registrado';
        setTimeout(function () { window.location.reload(); }, 900);
      })
      .catch(function (e) {
        say(e && e.message ? e.message : 'Não foi possível registrar o Encaixe.', 'error');
        btn.disabled = false; btn.textContent = 'Salvar Encaixe';
      });
  }

  /* ---------------- início ---------------- */
  function loadProfile() {
    if (!accessToken()) { authUser = null; profile = null; return Promise.resolve(null); }
    return api('/auth/v1/user').then(function (r) {
      authUser = (r && r.data && r.data.id) ? r.data : null;
      if (!authUser) { profile = null; return null; }
      return api('/rest/v1/profiles?select=id,nome,perfil&id=eq.' + enc(authUser.id) + '&limit=1')
        .then(function (p) { profile = (p && p.data && p.data[0]) || null; })
        .catch(function () { profile = null; });
    }).catch(function () {
      authUser = null; profile = null; return null;
    });
  }
  /* ---------------- início ---------------- */
  /* Usa a MESMA conexão que o sistema já abriu (mesma sessão de login). */
  function findClient() { return window.__crasSupabase || null; }
  var bootTries = 0, profileLoaded = false;
  function boot() {
    if (!sb) sb = findClient();
    if (!window.__crasEncaixeStarted && (sb || accessToken())) {
      window.__crasEncaixeStarted = true;
      window.__crasEncaixeReady = true;
      try { window.dispatchEvent(new CustomEvent('cras-encaixe-ok')); } catch (e) {}
      if (sb && sb.auth && typeof sb.auth.onAuthStateChange === 'function') {
        try {
          sb.auth.onAuthStateChange(function (_evt, session) {
            authUser = (session && session.user) || null;
            loadProfile().then(function () { profileLoaded = !!authUser; refreshCounter(); }).catch(function () {});
          });
        } catch (e) {}
      }
    }
    if (!profileLoaded && accessToken()) {
      loadProfile().then(function () {
        if (authUser) { profileLoaded = true; refreshCounter(); }
      }).catch(function () {});
    }
    try { syncButton(); } catch (e) {} try { syncConfig(); } catch (e) {}
    if (!profileLoaded && bootTries++ < 60) setTimeout(boot, 500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  watchNavigation();
  watchDom();
  setInterval(function () { if (!window.__crasEncaixeStarted && (sb || accessToken())) { bootTries = 0; boot(); } if (currentRoute()) refreshCounter(); }, 60000);
  ['focus', 'visibilitychange'].forEach(function (ev) {
    try { window.addEventListener(ev, function () { if (!profileLoaded) boot(); if (currentRoute()) refreshCounter(); }); } catch (e) {}
  });
})();

  function syncMsg() {

        if (hosts[i].innerText && hosts[i].innerText.indexOf(probe) >= 0) return true;
      }
    } catch (e) {}
    return false;
  }

  function showCard(m) {
    var w = wrapEl();
    var el = document.createElement('div');
    el.className = 'crx-ct';
    el.setAttribute('role', 'status');
    el.innerHTML = ''
      + '<div class="crx-ct-av"></div>'
      + '<div class="crx-ct-b">'
      + '  <div class="crx-ct-h"><span class="crx-ct-n"></span><span class="crx-ct-k"></span></div>'
      + '  <div class="crx-ct-t"></div>'
      + '  <div class="crx-ct-f"><button type="button" class="crx-ct-go">Abrir chat</button><button type="button" class="crx-ct-x" aria-label="Fechar">&times;</button></div>'
      + '</div>';
    el.querySelector('.crx-ct-av').textContent = initials(m.nome);
    el.querySelector('.crx-ct-n').textContent = m.nome || 'Nova mensagem';
    el.querySelector('.crx-ct-k').textContent = m.public ? 'Chat Geral' : 'Privada';
    el.querySelector('.crx-ct-t').textContent = m.texto || '';
    var close = function (e) { if (e) e.stopPropagation(); el.remove(); };
    el.querySelector('.crx-ct-x').addEventListener('click', close);
    el.addEventListener('click', function () { location.href = '/chat'; });
    w.appendChild(el);
    while (w.children.length > 3) w.removeChild(w.firstChild);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 12000);
  }

  function headline(n) {
    unread = n;
    var base = baseTitle.replace(/^\(\d+\)\s*/, '');
    document.title = n > 0 ? '(' + n + ') ' + base : base;
    try {
      if (navigator.setAppBadge) { if (n > 0) navigator.setAppBadge(n); else if (navigator.clearAppBadge) navigator.clearAppBadge(); }
    } catch (e) {}
  }

  function badge(n) {
    var runs = document.querySelectorAll('a[href="/chat"], a[href$="/chat"]'), i, a, b;
    for (i = 0; i < runs.length; i++) {
      a = runs[i];
      b = a.querySelector('.crx-chat-badge');
      var own = a.querySelector('span.rounded-full, span[class*="bg-danger"]');
      if (n <= 0) { if (b) b.remove(); continue; }
      if (!b) {
        if (own) { own.textContent = n > 99 ? '99+' : String(n); continue; }
        b = document.createElement('span');
        b.className = 'crx-chat-badge';
        a.appendChild(b);
      }
      b.textContent = n > 99 ? '99+' : String(n);
    }
  }

  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = window.__crxCtx || (window.__crxCtx = new AC());
      if (ctx.state === 'suspended') ctx.resume();
      var t = ctx.currentTime;
      [880, 1180].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i * 0.16);
        g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.16 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 0.14);
        o.connect(g); g.connect(ctx.destination);
        o.start(t + i * 0.16); o.stop(t + i * 0.16 + 0.15);
      });
    } catch (e) {}
  }

  var nativeStatus = 'Clique para testar o aviso neste computador.';
  function statusNative(text) {
    nativeStatus = text;
    var el = document.getElementById('crx-native-status');
    if (el) el.textContent = text;
  }
  var activeNativeReg=null;
  function nativeRegistration() {
    if(activeNativeReg && activeNativeReg.active && activeNativeReg.active.state==='activated') return Promise.resolve(activeNativeReg);
    if (!navigator.serviceWorker) return Promise.reject(new Error('Este navegador não oferece notificações persistentes.'));
    return navigator.serviceWorker.register('/sw.js', {updateViaCache:'none'}).then(function (reg) {
      if (reg.active && reg.active.state === 'activated') return reg;
      return new Promise(function (resolve, reject) {
        var timeout = setTimeout(function () { reject(new Error('O serviço de avisos não ativou. Atualize a página e teste novamente.')); }, 15000);
        navigator.serviceWorker.ready.then(function (ready) { clearTimeout(timeout); resolve(ready); }, function (err) { clearTimeout(timeout); reject(err); });
      });
    });
  }
  function notifyNative(m) {
    if (!('Notification' in window)) {
      statusNative('Notificações indisponíveis neste navegador. Use Chrome ou Edge atualizado.');
      return Promise.resolve(false);
    }
    if (Notification.permission !== 'granted') {
      statusNative(Notification.permission === 'denied' ? 'Bloqueado no navegador. Abra as configurações do site e permita Notificações.' : 'Clique em Ativar avisos e permita as notificações.');
      return Promise.resolve(false);
    }
    var title = 'CRAS · ' + (m.nome || 'Nova mensagem');
    var opts = {body:(m.public ? 'Chat Geral: ' : 'Mensagem privada: ') + (m.texto || ''), icon:'/icons/icon-192.png', badge:'/icons/icon-192.png', tag:'cras-chat-' + String(m.id || Date.now()), data:{url:'/chat'}, requireInteraction:true, silent:false};
    return nativeRegistration().then(function (reg) {
      activeNativeReg=reg;
      return reg.showNotification(title, opts);
    }).then(function () {
      statusNative('O navegador aceitou o aviso. Confira o canto da tela ou a Central de Notificações (Win + N). Se não aparecer, verifique os banners do Chrome/Edge e Não perturbe no Windows.');
      return true;
    }).catch(function (error) {
      statusNative('Falha ao enviar o aviso: ' + String(error && error.message || error));
      return false;
    });
  }

  function deliver(m, instant) {
    if (shown[m.id]) return;
    shown[m.id] = 1;
    if (inChat() && !document.hidden) return;
    notifyNative(m);
    if (document.hidden) {
      pending.push(m);
      if (pending.length > 6) pending = pending.slice(-6);
      beep();
      return;
    }
    setTimeout(function () {
      if (appAlreadyShowed(m.texto)) return;
      showCard(m);
    }, instant ? 0 : 900);
  }

  function flush() {
    if (document.hidden || inChat()) return;
    var list = pending.splice(0, pending.length);
    list.forEach(function (m, i) { setTimeout(function () { showCard(m); }, i * 160); });
  }

  var senderNames={};
  function names(rows) {
    var ids = {}, list = [], i;
    for (i = 0; i < rows.length; i++) if (!ids[rows[i].remetente_id] && !senderNames[rows[i].remetente_id]) { ids[rows[i].remetente_id] = 1; list.push(rows[i].remetente_id); }
    if (!list.length) return Promise.resolve(rows.map(function(r){return {id:r.id,texto:r.texto,nome:senderNames[r.remetente_id]||'Nova mensagem',public:r.destinatario_id==null};}));
    var q = 'profiles?select=id,nome&id=in.(' + list.map(function (x) { return '"' + x + '"'; }).join(',') + ')';
    return api(q).then(function (ps) {
      var map = senderNames;
      (ps || []).forEach(function (p) { map[p.id] = p.nome; });
      return rows.map(function (r) {
        return { id: r.id, texto: r.texto, nome: map[r.remetente_id] || 'Nova mensagem', public: r.destinatario_id === null || r.destinatario_id === undefined };
      });
    }).catch(function () {
      return rows.map(function (r) { return { id: r.id, texto: r.texto, nome: 'Nova mensagem', public: r.destinatario_id === null }; });
    });
  }

  function handleRows(rows, instant) {
    var s = session();
    var myId = s && s.user && s.user.id;
    if (!myId) return Promise.resolve();
    var fresh = [], i, r;
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      if (!r || !r.id) continue;
      if (r.remetente_id === myId) continue;
      if (String(r.lido) === 'true') continue;
      if (seen[r.id]) continue;
      seen[r.id] = 1;
      fresh.push(r);
    }
    if (!fresh.length) return Promise.resolve();
    return names(fresh).then(function (msgs) {
      msgs.forEach(function (m) { deliver(m, instant); });
    });
  }

  function tick() {
    var s = session();
    if (!s || !s.access_token) { headline(0); badge(0); return Promise.resolve(); }
    var myId = s.user && s.user.id;
    if (!myId) return Promise.resolve();
    var q = 'chat_mensagens?select=id,remetente_id,destinatario_id,texto,lido,created_at'
      + '&lido=eq.false&remetente_id=neq.' + encodeURIComponent(myId)
      + '&or=(destinatario_id.is.null,destinatario_id.eq.' + encodeURIComponent(myId) + ')'
      + '&order=created_at.desc&limit=30';
    return api(q).then(function (rows) {
      rows = rows || [];
      fails = 0;
      headline(rows.length);
      badge(rows.length);
      if (!baselineDone) {
        rows.forEach(function (r) { seen[r.id] = 1; });
        baselineDone = true;
        return;
      }
      return handleRows(rows, false);
    }).catch(function () { fails++; throw new Error('poll'); });
  }

  function wsSend(topic, event, payload, joinRef) {
    try {
      if (!ws || ws.readyState !== 1) return;
      var ref = String(refSeq++);
      ws.send(JSON.stringify([joinRef || null, ref, topic, event, payload || {}]));
    } catch (e) {}
  }

  function wsConnect() {
    var s = session();
    if (!s || !s.access_token) return;
    if (!('WebSocket' in window)) return;
    try { if (ws) { ws.onclose = null; ws.close(); } } catch (e) {}
    try { ws = new WebSocket(WS_BASE + '?apikey=' + encodeURIComponent(ANON) + '&vsn=2.0.0'); }
    catch (e) { wsLater(); return; }
    ws.onopen = function () {
      wsOpen = true; wsTries = 0; joined = false;
      clearTimeout(timer);
      timer = setTimeout(loop, 1500);
      joinRef = String(refSeq);
      wsSend('realtime:chat-notifications-global', 'phx_join', {
        config: {
          broadcast: { ack: false, self: false },
          presence: { key: '' },
          postgres_changes: [{ event: 'INSERT', schema: 'public', table: 'chat_mensagens' }],
          private: false
        },
        access_token: s.access_token
      }, joinRef);
      if (beat) clearInterval(beat);
      beat = setInterval(function () { wsSend('phoenix', 'heartbeat', {}, null); }, 25000);
      setTimeout(function () {
        if (joined) return;
        wsOpen = false;
        clearTimeout(timer);
        timer = setTimeout(loop, 1500);
      }, 7000);
    };
    ws.onmessage = function (ev) {
      var m, event, payload;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (Object.prototype.toString.call(m) === '[object Array]') { event = m[3]; payload = m[4]; }
      else if (m && typeof m === 'object') { event = m.event; payload = m.payload; }
      else return;
      if (event === 'postgres_changes') {
        var rec = (payload && ((payload.data && payload.data.record) || payload.record || payload.new)) || null;
        if (rec) onRealtime(rec);
        return;
      }
      var replyRef = Array.isArray(m) ? m[1] : m.ref;
      if (event === 'phx_reply' && String(replyRef) === String(joinRef)) {
        if (payload && payload.status === 'ok') {
          wsTries = 0; joined = true; wsOpen = true;
          tick().catch(function () {});
        } else {
          joined = false; wsOpen = false;
          statusNative('Canal de mensagens indisponível. A conferência automática continua ativa.');
          clearTimeout(timer);
          timer = setTimeout(loop, 2000);
        }
      }
    };
    ws.onclose = function () {
      wsOpen = false; joined = false;
      if (beat) clearInterval(beat);
      clearTimeout(timer);
      timer = setTimeout(loop, 2500);
      wsLater();
    };
    ws.onerror = function () { wsOpen = false; joined = false; };
  }

  function wsLater() {
    wsTries++;
    var wait = Math.min(60000, 3000 * Math.pow(1.7, Math.min(wsTries, 6)));
    setTimeout(wsConnect, wait);
  }

  function onRealtime(rec) {
    var s = session();
    var myId = s && s.user && s.user.id;
    if (!myId || !rec || !rec.id) return;
    if (rec.remetente_id === myId) return;
    if (!(rec.destinatario_id === null || rec.destinatario_id === undefined || rec.destinatario_id === myId)) return;
    if (String(rec.lido) === 'true') return;
    if (seen[rec.id]) return;
    handleRows([rec], true);
  }

  function nudge() {
    if (document.getElementById('crx-chat-controls')) return;
    var open = document.createElement('button');
    open.id = 'crx-chat-controls'; open.type = 'button';
    open.textContent = 'Avisos do Windows';
    open.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:2147482000;background:#0f2c3f;color:white;border:0;border-radius:9px;padding:9px 12px;font:600 12px system-ui;cursor:pointer';
    document.body.appendChild(open);
    var panel = null;
    open.addEventListener('click', function () {
      if (panel) { panel.remove(); panel=null; return; }
      panel = document.createElement('div'); panel.className='crx-native-panel'; panel.id='crx-chat-nudge';
      panel.style.cssText='position:fixed;right:12px;bottom:56px;z-index:2147483001;background:white;color:#0f2c3f;border:1px solid #dbe4ef;border-radius:12px;padding:16px;box-shadow:0 10px 35px #0003;width:min(360px,calc(100vw - 24px));box-sizing:border-box;font:13px/1.5 system-ui';
      panel.innerHTML='<strong>Avisos do Windows · v176</strong><p>Receba avisos com o sistema aberto ou minimizado. O navegador precisa continuar aberto.</p><p id="crx-native-status" role="status"></p><button type="button" class="crx-native-enable">Ativar avisos</button> <button type="button" class="crx-native-test">Testar aviso do Windows</button><p>Não apareceu? No Windows, ative as notificações e os banners do Chrome/Edge e desative Não perturbe.</p><button type="button" class="crx-native-close">Fechar</button>';
      panel.querySelector('#crx-native-status').textContent=nativeStatus;
      Array.prototype.forEach.call(panel.querySelectorAll('button'),function (button) {button.style.cssText='border:0;border-radius:7px;background:#1a5276;color:white;padding:8px;margin:3px 0;cursor:pointer;font:600 12px system-ui';});
      function activate(test) {
        if (!('Notification' in window)) {statusNative('Notificações indisponíveis neste navegador.');return;}
        if (!window.isSecureContext) {statusNative('Abra o sistema no endereço seguro HTTPS.');return;}
        function send(p) {
          if (p !== 'granted') {statusNative(p==='denied'?'Bloqueado. Permita Notificações nas configurações do site.':'Permissão ainda não concedida. Clique novamente e escolha Permitir.');return;}
          notifyNative({id:'test-'+Date.now(),nome:'Teste de aviso',public:true,texto:test?'Se você está vendo este aviso, a entrega neste computador funcionou.':'Avisos ativados neste navegador.'});
        }
        if (Notification.permission==='default') Notification.requestPermission().then(send).catch(function(e){statusNative('Não foi possível pedir permissão: '+e.message);});
        else send(Notification.permission);
      }
      panel.querySelector('.crx-native-enable').addEventListener('click',function(){activate(false);});
      panel.querySelector('.crx-native-test').addEventListener('click',function(){activate(true);});
      panel.querySelector('.crx-native-close').addEventListener('click',function(){panel.remove();panel=null;});
      document.body.appendChild(panel);
    });
  }

  function loop() {
    if (busy) return;
    busy = true;
    tick().catch(function () {}).then(function () {
      busy = false;
      clearTimeout(timer);
      var wait = fails > 2 ? 30000 : (joined ? POLL_LIVE : POLL_OK);
      timer = setTimeout(loop, wait);
    });
  }

  function boot() {
    style();
    baseTitle = document.title || 'CRAS';
    setTimeout(function () { loop(); wsConnect(); nudge(); }, 2500);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { flush(); loop(); }
    });
    window.addEventListener('focus', flush);
    window.addEventListener('online', function () { loop(); if (!wsOpen) wsConnect(); });
    var lastPath = location.pathname;
    setInterval(function () {
      if (location.pathname !== lastPath) { lastPath = location.pathname; loop(); }
      if (!wsOpen && session()) wsConnect();
    }, 20000);
    document.addEventListener('click', function once() {
      if ('Notification' in window && Notification.permission === 'default') nudge();
      document.removeEventListener('click', once);
    }, { once: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();


</script>
