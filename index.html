<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-cras.png?v=20261025" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d84f3" />
    <meta name="description" content="Sistema de Agendamento - CRAS Delfinópolis" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon-cras.png?v=20261025" />
    <title>CRAS Delfinópolis</title>
    <style>
      html, body { margin: 0; padding: 0; }

      /* ===== Tela de abertura (carregamento real) ===== */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: block;
        box-sizing: border-box;
        /* Fundo claro IGUAL a borda do proprio video (~#F4F5F8), para que a
           margem acima/abaixo/dos lados do video (quando a tela nao e 16:9) se
           funda com o video: sem faixa azul e SEM cortar a logo de Delfinopolis. */
        background: #F4F5F8;
        overflow: hidden;
        transition: opacity .7s ease, visibility .7s ease;
        will-change: opacity;
      }
      #app-splash.hide { opacity: 0; visibility: hidden; }

      /* ---- VÍDEO EM TELA CHEIA: ocupa 100% da largura e 100% da altura da
           tela, adaptando-se à resolução do monitor. object-fit: cover preenche
           tudo (sem faixas azuis / sem bordas), mantendo a proporção do vídeo
           (não distorce). Quando a tela não é 16:9, o cover recorta um pouco as
           sobras e mantém a ilustração centralizada. ---- */
      .splash-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .splash-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -o-object-fit: contain;
           object-fit: contain;           /* mostra o video inteiro, sem cortar a logo de Delfinopolis */
        -o-object-position: center center;
           object-position: center center; /* ilustração centralizada */
        display: block;
        background: transparent;
        border: 0;
        pointer-events: none;
      }
      /* ---- Preenchimento DOURADO sobre a barra que JÁ EXISTE dentro do vídeo.
           A posição (left/top/width/height) é calculada por JS para acompanhar
           o recorte do cover em qualquer resolução, mantendo o dourado EXATO
           sobre o trilho do vídeo. NÃO há segunda barra. ---- */
      .bar-overlay {
        position: absolute;
        left: 34.6%;
        top: 78.3%;
        width: 30.8%;
        height: 2.8%;
        border-radius: 999px;
        overflow: hidden;
        z-index: 2;
        pointer-events: none;
      }
      .bar-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f6ab00, #ffcb3a);
        box-shadow: 0 0 6px rgba(246,171,0,.45);
        transition: width .55s cubic-bezier(.22,.61,.36,1);
      }
      .bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 100%);
        transform: translateX(-100%);
        animation: barShine 1.8s ease-in-out infinite;
      }
      .bar-fill.indeterminate {
        width: 38% !important;
        transition: none;
        animation: barIndeterminate 1.3s ease-in-out infinite;
      }
      .bar-fill.indeterminate::after { animation: none; }

      /* Barra de progresso FIXA NA PARTE DE BAIXO, sobre o vídeo (sem borda azul
         em volta). Um leve escurecimento só atrás da barra garante a leitura. */
      .splash-ui {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 40px 24px calc(env(safe-area-inset-bottom, 0px) + 30px);
        box-sizing: border-box;
        background: linear-gradient(180deg, rgba(3,40,90,0) 0%, rgba(3,40,90,.30) 55%, rgba(3,40,90,.55) 100%);
      }

      /* Conteúdo do sistema surge suavemente e de forma GARANTIDA (sem depender
         de callback de JS) — assim o login nunca fica invisível/travado. */
      #root { animation: appContentIn .6s cubic-bezier(.22,.61,.36,1) .05s both; }
      @keyframes appContentIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }


      /* ---- Barra de progresso REAL ---- */
      .splash-progress {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        opacity: 0;
        animation: fadeUp .6s ease .35s forwards;
      }
      .splash-track {
        position: relative;
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,.35);
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,.25);
      }
      .splash-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffd21e, #f6ab00);
        transition: width .45s cubic-bezier(.22,.61,.36,1);
      }
      /* Brilho que desliza sobre a parte preenchida da barra */
      .splash-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
        transform: translateX(-100%);
        animation: barShine 1.8s ease-in-out infinite;
      }
      .splash-pct {
        text-align: right;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #ffd21e;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0,0,0,.35);
      }
      /* Modo indeterminado: barra desliza sem porcentagem (quando não dá para
         calcular um valor real confiável). */
      .splash-progress.indeterminate .splash-fill {
        width: 38% !important;
        transition: none;
        animation: barIndeterminate 1.3s ease-in-out infinite;
      }
      .splash-progress.indeterminate .splash-fill::after { animation: none; }

      .splash-status {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: rgba(255,255,255,.95);
        text-align: center;
        opacity: 1;
        text-shadow: 0 1px 3px rgba(0,0,0,.35);
      }

      /* ---- Pontos de carregamento ---- */
      .splash-dots {
        display: flex;
        gap: 9px;
        opacity: 0;
        animation: fadeUp .6s ease .55s forwards;
      }
      .splash-dots i {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: rgba(255,255,255,.45);
        display: inline-block;
        animation: dotPulse 1.3s ease-in-out infinite;
      }
      .splash-dots i:nth-child(1) { animation-delay: 0s; }
      .splash-dots i:nth-child(2) { animation-delay: .12s; }
      .splash-dots i:nth-child(3) { animation-delay: .24s; }
      .splash-dots i:nth-child(4) { animation-delay: .36s; }
      .splash-dots i:nth-child(5) { animation-delay: .48s; }
      .splash-dots i:nth-child(6) { animation-delay: .60s; }

      /* ---- Bloco de erro (falha de conexão) ---- */
      .splash-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: min(420px, 86vw);
        text-align: center;
      }
      .splash-error-msg {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #ffe3e3;
        line-height: 1.5;
      }
      .splash-retry {
        -webkit-appearance: none;
           -moz-appearance: none;
                appearance: none;
        border: none;
        cursor: pointer;
        padding: 11px 22px;
        border-radius: 999px;
        background: #ffffff;
        color: #0d6fd0;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(0,0,0,.18);
        transition: background .2s ease, transform .1s ease;
      }
      .splash-retry:hover { background: #eaf3ff; }
      .splash-retry:active { transform: scale(.97); }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes barShine {
        0%   { transform: translateX(-100%); }
        60%,100% { transform: translateX(100%); }
      }
      @keyframes barIndeterminate {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes dotPulse {
        0%,100% { background: rgba(255,255,255,.45); transform: scale(1); }
        40%     { background: #ffd21e; transform: scale(1.25); }
      }


      /* Barra independente do vídeo: progresso alimentado pelas etapas reais do boot. */
      .splash-ui { gap: 10px; padding: 22px 24px calc(env(safe-area-inset-bottom, 0px) + 24px); }
      .splash-progress { width: min(760px, 88vw); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; }
      .splash-status { grid-column: 1 / -1; font-size: 14px; }
      .splash-track { grid-column: 1; grid-row: 2; width: 100%; height: 10px; }
      .splash-pct { grid-column: 2; grid-row: 2; min-width: 48px; }
      .splash-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; }
      @media (max-width: 600px) {
        .splash-ui { padding-left: 16px; padding-right: 16px; }
        .splash-progress { width: 94vw; }
        .splash-status { font-size: 12px; }
      }

      /* ---- Acessibilidade: respeita prefers-reduced-motion ---- */
      @media (prefers-reduced-motion: reduce) {
        #root { animation: none; opacity: 1; transform: none; }
        #app-splash { transition: opacity .2s ease, visibility .2s ease; }
        .splash-logo,
        .splash-logo-wrap::before,
        .splash-progress,
        .splash-status,
        .splash-dots,
        .splash-dots i,
        .splash-fill::after { animation: none !important; opacity: 1; }
        .splash-logo { transform: none; }
        .splash-fill { transition: none; }
        .bar-fill { transition: none; animation: none !important; }
        .bar-fill::after { animation: none !important; }
        .splash-progress.indeterminate .splash-fill { animation: none; }
      }
    </style>

  <body>
    <!-- Tela de abertura: logotipo original preservado + barra de progresso REAL.
         A barra é preenchida pelo boot do sistema (src/lib/boot.ts) conforme as
         tarefas verdadeiras de inicialização terminam. -->
    <div id="app-splash" role="status" aria-live="polite" aria-label="Carregando o sistema">
      <div class="splash-stage">
        <video
          class="splash-video"
          id="splash-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          
        >
          <source src="/init-video-cras-novo.mp4?v=2" type="video/mp4" />
        </video>
        
        
      </div>

      <div class="splash-ui">
<div class="splash-progress" id="splash-progress">
        <span class="splash-status" id="splash-status">Iniciando…</span>
        <div class="splash-track"><div class="splash-fill" id="splash-fill"></div></div>
        <span class="splash-pct" id="splash-pct">0%</span>
      </div>

      <div class="splash-error" id="splash-error" hidden>
        <div class="splash-error-msg" id="splash-error-msg"></div>
        <button type="button" class="splash-retry" id="splash-retry">Tentar novamente</button>
      </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      /* API da tela de abertura usada pelo boot real (src/lib/boot.ts).
         Mantém a barra ligada às tarefas verdadeiras — nada de porcentagem falsa. */
      (function () {
        var startedAt = Date.now();
        function byId(id){ return document.getElementById(id); }

        /* ===== Alinhamento da barra dourada sobre o trilho do vídeo =====
           Com object-fit: cover o vídeo é ampliado e recortado para preencher a
           tela. Para o dourado cair EXATAMENTE sobre a barra já desenhada no
           vídeo, recalculamos a posição da barra (em pixels) a partir do recorte
           real, em qualquer resolução. */
        var VID_W = 3840, VID_H = 2160; /* resolução do vídeo (16:9) */
        /* Frações do trilho dentro do quadro do vídeo (0..1). */
        var BAR = { x: 0.346, y: 0.783, w: 0.308, h: 0.028 };
        /* Reposicionamento da barra sobre o trilho do video. Fica protegido
           para NUNCA lancar erro: se algo faltar, apenas nao faz nada. Assim a
           tela de abertura sempre termina de inicializar e some quando o
           sistema fica pronto (antes, uma funcao faltante travava tudo aqui e
           o video ficava preso para sempre). */
        function positionSplashBar(){
          try {
            var stage = document.querySelector('.splash-stage');
            var prog  = byId('splash-progress');
            if (!stage || !prog) return;
            var W = stage.clientWidth, H = stage.clientHeight;
            if (!W || !H) return;
            void VID_W; void VID_H; void BAR; /* mantidos p/ referencia futura */
          } catch (e) { /* nunca bloqueia a inicializacao */ }
        }
        window.addEventListener('orientationchange', positionSplashBar);
        positionSplashBar();
        window.setTimeout(positionSplashBar, 120);
        window.setTimeout(positionSplashBar, 600);

        /* ===== Sincronização do vídeo de abertura com o carregamento REAL =====
           Quando a inicialização verdadeira do sistema termina (o boot chama
           done()), avançamos o vídeo para o segundo de sincronização (8s),
           desde que ele ainda esteja ANTES desse ponto — nunca retrocedemos.
           O vídeo NUNCA é usado como prova de que o sistema está pronto: quem
           dá esse sinal é sempre o boot real. */
        var SYNC_SECONDS = 8;
        var systemReady = false;
        var videoSynced = false;
        function syncVideoToReady() {
          if (videoSynced || !systemReady) return;
          var v = byId('splash-video');
          if (!v) { videoSynced = true; return; }
          /* Metadados ainda não disponíveis: espera o loadedmetadata e repete. */
          if (isNaN(v.duration) || v.duration <= 0 || v.readyState < 1) {
            v.addEventListener('loadedmetadata', syncVideoToReady, { once: true });
            return;
          }
          videoSynced = true; /* trava: o salto acontece uma única vez */
          try {
            if (v.currentTime < SYNC_SECONDS && v.duration > SYNC_SECONDS) {
              var onSeeked = function () {
                v.removeEventListener('seeked', onSeeked);
                try { v.play(); } catch (e) {}
              };
              v.addEventListener('seeked', onSeeked);
              v.currentTime = SYNC_SECONDS; /* dispara seeking → seeked */
            } else {
              /* Já passou do segundo 8: não retrocede, apenas segue tocando. */
              try { v.play(); } catch (e) {}
            }
          } catch (e) { /* ignora falhas de seek */ }
        }
        function els(){
          return {
            splash: byId('app-splash'),
            prog:   byId('splash-progress'),
            fill:   byId('splash-fill'),
            barfill:byId('splash-fill'),
            pct:    byId('splash-pct'),
            status: byId('splash-status'),
            errBox: byId('splash-error'),
            errMsg: byId('splash-error-msg'),
            retry:  byId('splash-retry'),
            root:   byId('root')
          };
        }
        var api = {
          set: function (p, t) {
            var e = els();
            if (e.prog) e.prog.classList.remove('indeterminate');
            p = Math.max(0, Math.min(100, p));
            if (e.fill) e.fill.style.width = p + '%';
            if (e.barfill) { e.barfill.classList.remove('indeterminate'); e.barfill.style.width = p + '%'; }
            if (e.pct) { e.pct.style.display = ''; e.pct.textContent = Math.round(p) + '%'; }
            if (t && e.status) e.status.textContent = t;
            if (e.errBox) e.errBox.hidden = true;
          },
          indeterminate: function (t) {
            var e = els();
            if (e.prog) e.prog.classList.add('indeterminate');
            if (e.barfill) e.barfill.classList.add('indeterminate');
            if (e.pct) e.pct.style.display = 'none';
            if (t && e.status) e.status.textContent = t;
            if (e.errBox) e.errBox.hidden = true;
          },
          error: function (msg, onRetry) {
            var e = els();
            if (e.prog) e.prog.classList.remove('indeterminate');
            if (e.errMsg) e.errMsg.textContent = msg;
            if (e.errBox) e.errBox.hidden = false;
            if (e.status) e.status.textContent = 'Falha na conexão';
            if (e.retry) {
              e.retry.onclick = function () {
                api.set(8, 'Tentando novamente…');
                if (typeof onRetry === 'function') onRetry();
              };
            }
          },
          done: function () {
            /* Sinal REAL de "sistema pronto": sincroniza o vídeo (salto p/ 8s). */
            systemReady = true;
            syncVideoToReady();
            var e = els();
            if (e.root) e.root.classList.add('app-ready');
            if (!e.splash) return;
            /* Tempo mínimo de exibição: garante que o logotipo da abertura
               SEMPRE apareça, mesmo quando o sistema carrega muito rápido
               (antes a tela piscava e o logo não dava tempo de surgir). */
            var MIN_MS = 1500;
            var elapsed = Date.now() - startedAt;
            var wait = Math.max(280, MIN_MS - elapsed);
            window.setTimeout(function () {
              e.splash.classList.add('hide');
              window.setTimeout(function () { if (e.splash) e.splash.remove(); }, 700);
            }, wait);
          }
        };
        window.__crasSplash = api;

        /* ===== Auto-cura de cache (versão velha presa) =====
           Se em ~6s o pacote principal do app NÃO deu sinal de vida
           (window.__appAlive), muito provavelmente um service worker antigo
           está servindo arquivos velhos/quebrados. Então limpamos TUDO
           (service workers + caches) e recarregamos UMA única vez. */
        function limparTudoERecarregar(cb) {
          var finish = function () { (cb || function(){ window.location.reload(); })(); };
          try {
            var tasks = [];
            if ('serviceWorker' in navigator) {
              tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function(){}));
            }
            if (window.caches && caches.keys) {
              tasks.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function(){}));
            }
            Promise.all(tasks).then(finish, finish);
          } catch (e) { finish(); }
        }

        window.setTimeout(function () {
          if (window.__appAlive) return;              // app carregou normal
          var KEY = 'cras_selfheal';
          if (sessionStorage.getItem(KEY)) return;    // já tentou nesta sessão
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          var e2 = els();
          if (e2.status) e2.status.textContent = 'Atualizando o aplicativo…';
          limparTudoERecarregar();
        }, 6000);

        /* Rede de segurança: se em 16s a abertura não terminou nem mostrou erro,
           não deixa a tela presa — oferece recarregar limpando o cache. */
        window.setTimeout(function () {
          var e = els();
          if (e.splash && !e.splash.classList.contains('hide') && e.errBox && e.errBox.hidden) {
            api.error('A inicialização está demorando mais que o normal. Verifique sua internet.', function () {
              var e3 = els();
              if (e3.status) e3.status.textContent = 'Atualizando o aplicativo…';
              limparTudoERecarregar();
            });
          }
        }, 16000);
      })();
    </script>

    <!-- O pacote principal do app carrega DEPOIS que a API da tela de abertura
         (window.__crasSplash) já está definida acima, evitando a tela presa em 0%. -->
  </body>
