<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-cras.png?v=20261009" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6F88B0" />
    <meta name="description" content="Sistema de Agendamento - CRAS Delfinópolis" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Pré-carrega a abertura para aparecer mais rápido -->
    <link rel="preload" as="image" href="/splash-poster-v6.jpg?v=6" />
    <link rel="preload" as="fetch" href="/animacao-cras-v6.mp4?v=6" type="video/mp4" crossorigin="anonymous" />
    <link rel="apple-touch-icon" href="/favicon-cras.png?v=20261009" />
    <title>CRAS Delfinópolis</title>
    <style>
      /* Reset para o vídeo de abertura ocupar a tela inteira, sem margens */
      html, body { margin: 0; padding: 0; }
      /* ===== Tela de abertura (splash) animada ===== */
      #app-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #6F88B0;
        overflow: hidden;
        transition: opacity .7s ease, visibility .7s ease, transform .7s cubic-bezier(.22,.61,.36,1);
        will-change: opacity, transform;
      }
      #app-splash.hide {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.045);
      }
      /* Conteúdo do sistema (login) surge suavemente, de forma GARANTIDA.
         Usa animação que termina sozinha (fill-mode both), SEM depender de
         nenhum código JS avisar — assim o login nunca fica invisível/travado. */
      #root {
        animation: appContentIn .65s cubic-bezier(.22,.61,.36,1) .1s both;
      }
      @keyframes appContentIn {
        from { opacity: 0; transform: translateY(10px) scale(.994); }
        to   { opacity: 1; transform: none; }
      }
      /* Vídeo de abertura centralizado na tela (sem ficar puxado pra baixo).
         Mantém a proporção do vídeo e fica no meio, com o fundo azul em volta. */
      #app-splash .splash-video {
        position: relative;
        width: 100vw;
        max-width: 100%;
        height: auto;
        max-height: 100vh;
        object-fit: contain;
        background: #6F88B0;
      }
      #app-splash .splash-logo {
        width: 300px;
        max-width: 76vw;
        height: auto;
        will-change: opacity, transform, filter;
        animation: splashLogoIn 1.2s cubic-bezier(.22,.61,.36,1) both,
                   splashFloat 3.6s ease-in-out 1.3s infinite;
      }
      #app-splash .splash-title {
        color: #fff;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: .5px;
        opacity: 0;
        animation: splashFade .6s ease .5s forwards;
      }
      #app-splash .splash-sub {
        color: rgba(255,255,255,.8);
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-size: 13px;
        margin-top: -14px;
        opacity: 0;
        animation: splashFade .6s ease .75s forwards;
      }
      #app-splash .splash-bar {
        width: 160px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,.25);
        overflow: hidden;
        opacity: 0;
        animation: splashFade .6s ease .9s forwards;
      }
      #app-splash .splash-bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: #fff;
        animation: splashLoad 1.1s ease-in-out infinite;
      }
      /* Entrada suave do logo: fade-in + leve aproximação, subida e desfoque saindo */
      @keyframes splashLogoIn {
        0% {
          opacity: 0;
          transform: scale(.9) translateY(18px);
          filter: drop-shadow(0 16px 38px rgba(0,0,0,0)) blur(7px);
        }
        60% { opacity: 1; }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: drop-shadow(0 16px 38px rgba(0,0,0,.45)) blur(0);
        }
      }
      @keyframes splashFloat {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-8px); }
      }
      @keyframes splashFade {
        to { opacity: 1; }
      }
      @keyframes splashLoad {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #root { animation: none; opacity: 1; transform: none; }
        #app-splash { transition: opacity .2s ease, visibility .2s ease; }
        #app-splash.hide { transform: none; }
        #app-splash .splash-logo,
        #app-splash .splash-title,
        #app-splash .splash-sub,
        #app-splash .splash-bar,
        #app-splash .splash-bar > span { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Tela de abertura animada (removida automaticamente ao carregar o sistema) -->
    <div id="app-splash">
      <video
        class="splash-video"
        src="/animacao-cras-v6.mp4?v=6"
        poster="/splash-poster-v6.jpg?v=6"
        autoplay
        muted
        playsinline
        preload="auto"
        aria-label="CRAS Delfinópolis"
      ></video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Rede de segurança: se por qualquer motivo o sistema não terminar de
         carregar, esconde a tela de abertura mesmo assim para não travar. */
      window.setTimeout(function () {
        var r = document.getElementById('root');
        if (r) r.classList.add('app-ready');
        var s = document.getElementById('app-splash');
        if (s) {
          s.classList.add('hide');
          window.setTimeout(function () { if (s) s.remove(); }, 700);
        }
      }, 9000);
    </script>
  </body>
</html>
